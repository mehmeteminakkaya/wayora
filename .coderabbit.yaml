language: "tr-TR"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/node_modules/**"
    - "!api/src/generated/**"
    - "!**/package-lock.json"
    - "!coverage/**"
    - "!dist/**"
  path_instructions:
    - path: "api/**"
      instructions: |
        Wayora API kuralları (api/AGENTS.md):
        - Hata biçimi { error: { code, message } } olmalı.
        - Tüm girdiler zod ile doğrulanmalı (parseOrThrow).
        - Trip/Day/Activity sorgularında userId filtresi zorunlu; başkasının kaynağı 404.
        - Yeni davranış için başarı + hata testi iste.
        - Gizli anahtar, ham hata veya console.log bırakılmamalı.
    - path: "api/src/services/**"
      instructions: |
        LLM servisi kuralları (api/src/services/AGENTS.md):
        - Kullanıcı notları <untrusted_user_notes> içinde ve veri olarak işaretlenmeli.
        - LLM çıktısı zod ile doğrulanmalı; aday dışı googlePlaceId atılmalı.
        - Toplam maliyet sunucuda hesaplanmalı.
        - Sağlayıcı hatasında offline fallback ve meta.fallback olmalı.
    - path: "web/**"
      instructions: |
        Wayora web kuralları (web/AGENTS.md):
        - Bileşenler doğrudan fetch çağırmamalı; api.ts kullanılmalı.
        - Kullanıcı metinleri Türkçe, form alanları etiketli, ikon butonlarda aria-label olmalı.
        - Tasarım değişkenleri :root ve prefers-color-scheme: dark içinde güncellenmeli.
        - Korumalı sayfalar ProtectedRoute altında olmalı.
    - path: "**/*.md"
      instructions: |
        Dokümanlar Türkçe ve kısa olmalı. Komutlar çalıştırılabilir olmalı; ölü bağlantı bırakma.
    - path: ".github/**"
      instructions: |
        CI güvenlik kontrollerini zayıflatma. Yeni adım eklerken permissions en az yetki ilkesine uy.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
